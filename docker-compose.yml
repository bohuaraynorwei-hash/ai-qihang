# 给不想单独买腾讯云 Redis 的人：应用 + Redis 一起跑（单机小规模够用）
# 生产建议用腾讯云「云数据库 Redis」，把 REDIS_URL 指向它，并删掉下面的 redis 服务。
services:
  app:
    build: .
    container_name: ai-qihang
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD:-aiqihang-redis-pass}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ai-qihang-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-aiqihang-redis-pass}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aiqihang-redis-pass}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # 只给容器网络用，不对外暴露端口（要外连再放开 6379）
    expose:
      - "6379"

volumes:
  redis-data:
